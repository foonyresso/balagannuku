<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Демо стилю: Kingdom</title>
<style>
  html,body{margin:0;height:100%;background:#0c0a12;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;left:0;top:0}
  #ui{position:fixed;left:12px;top:10px;color:#d8cdb8;font-size:13px;text-shadow:0 1px 2px #000;z-index:2}
  #ui b{font-size:15px;letter-spacing:.5px}
  #ui button{background:#2a2433cc;color:#e8dcc4;border:1px solid #6b5a4a;border-radius:3px;padding:4px 10px;margin:6px 4px 0 0;cursor:pointer;font:inherit}
  #ui button.on{background:#7a5a34;border-color:#d8b26a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><b>Балаганники — стиль «Kingdom»</b><br>
  <span style="opacity:.7">піксельарт, силуети, тепле світло, ізометрія ~42°</span><br>
  <button data-t="dusk" class="on">Сутінки</button><button data-t="night">Ніч</button><button data-t="dawn">Світанок</button>
</div>
<script>
'use strict';
// ---------- налаштування ----------
const ISO = Math.sin(42 * Math.PI / 180); // як VIEW_ANGLE_DEG у src/render/projection.ts
const GW = 1400, GH = 640, GCX = 700, GCY = 320; // розмір «землі» та її центр (екранні одиниці)
const TIMES = {
  dusk:  { amb: [0.55, 0.45, 0.60], fire: 1.0, vig: 0.55, fog: [200, 170, 200] },
  night: { amb: [0.20, 0.25, 0.43], fire: 1.3, vig: 0.70, fog: [120, 140, 190] },
  dawn:  { amb: [0.82, 0.66, 0.60], fire: 0.6, vig: 0.38, fog: [255, 220, 200] },
};
let timeKey = 'dusk';
const amb = [...TIMES.dusk.amb];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- піксельні примітиви ----------
function disc(c, cx, cy, r, col) { c.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); c.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function inPoly(x, y, p) { let o = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) o = !o; } return o; }
function poly(c, p, col) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of p) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) for (let x = Math.floor(x0); x <= Math.ceil(x1); x++)
    if (inPoly(x + .5, y + .5, p)) { c.fillStyle = typeof col === 'function' ? col(x, y) : col; c.fillRect(x, y, 1, 1); }
}

// ---------- спрайти (процедурні) ----------
function makeOak(seed, big) {
  const R = rng(seed), W = 56, H = 72, [cv, c] = mk(W, H), cx = 28;
  c.fillStyle = '#241a20'; c.fillRect(cx - 2, 46, 5, 24); c.fillRect(cx - 4, 66, 9, 4); c.fillStyle = '#3a2a2c'; c.fillRect(cx - 2, 46, 1, 22);
  const blobs = []; for (let i = 0; i < (big ? 9 : 7); i++) blobs.push([cx + (R() - .5) * 26, 30 + (R() - .5) * 22, 8 + R() * 5]);
  blobs.push([cx, 24, 12]);
  for (const [x, y, r] of blobs) disc(c, Math.round(x), Math.round(y), Math.round(r), '#1b2a2b');
  for (const [x, y, r] of blobs) disc(c, Math.round(x - 1), Math.round(y - 2), Math.round(r - 2), '#2c4638');
  for (const [x, y, r] of blobs) disc(c, Math.round(x - 3), Math.round(y - 4), Math.round(r - 5), '#46663f');
  for (let i = 0; i < 40; i++) { const [x, y, r] = blobs[Math.floor(R() * blobs.length)]; c.fillStyle = R() < .5 ? '#7d8f4c' : '#5d7a45'; c.fillRect(Math.round(x - 4 + R() * 3), Math.round(y - r + 1 + R() * 4), 1, 1); }
  for (let i = 0; i < 30; i++) { c.fillStyle = '#1b2a2b'; c.fillRect(8 + Math.floor(R() * 40), 40 + Math.floor(R() * 8), 1, 1); }
  return { cv, ax: cx, ay: 70 };
}
function makePine(seed) {
  const R = rng(seed), W = 40, H = 72, [cv, c] = mk(W, H), cx = 20;
  c.fillStyle = '#241a20'; c.fillRect(cx - 1, 56, 3, 14);
  const tiers = 5;
  for (let k = 0; k < tiers; k++) {
    const top = 6 + k * 11, hh = 16 + k * 2, hw = 6 + k * 3;
    poly(c, [[cx, top], [cx + hw, top + hh], [cx - hw, top + hh]], (x, y) => (x < cx - (y - top) * .1 ? '#2c4a43' : '#1a2b30'));
    for (let i = 0; i < 6; i++) { c.fillStyle = '#4f7154'; const yy = top + 3 + Math.floor(R() * (hh - 4)); c.fillRect(cx - Math.floor((yy - top) / hh * hw) + Math.floor(R() * 4), yy, 1, 1); }
  }
  return { cv, ax: cx, ay: 70 };
}
function makeBush(seed) {
  const R = rng(seed), [cv, c] = mk(24, 14);
  for (let i = 0; i < 4; i++) disc(c, 6 + i * 4, 7 + (R() * 2 | 0), 4, '#1f3230');
  for (let i = 0; i < 4; i++) disc(c, 5 + i * 4, 6 + (R() * 2 | 0), 3, '#3a5a3e');
  for (let i = 0; i < 8; i++) { c.fillStyle = R() < .3 ? '#d8b0b8' : '#6f8a4a'; c.fillRect(3 + R() * 16 | 0, 3 + R() * 6 | 0, 1, 1); }
  return { cv, ax: 12, ay: 13 };
}
function makeHouse() {
  const [cv, c] = mk(76, 72);
  // бокова стіна, фасад, фундамент
  poly(c, [[50, 32], [68, 23], [68, 51], [50, 60]], '#35282a');
  poly(c, [[6, 32], [50, 32], [50, 60], [6, 60]], (x, y) => (y % 5 === 0 ? '#46332b' : '#5b4335'));
  c.fillStyle = '#3f3a3c'; c.fillRect(5, 56, 46, 5); poly(c, [[50, 56], [68, 47], [68, 52], [50, 61]], '#2c2628');
  for (let i = 0; i < 9; i++) { c.fillStyle = '#524c4d'; c.fillRect(6 + i * 5, 57 + (i % 2), 3, 1); }
  // дах: фронтон і правий скат
  poly(c, [[28, 8], [54, 32], [68, 25], [42, 1]], (x, y) => ((y + (x >> 1)) % 4 === 0 ? '#3b1c24' : '#4e2430'));
  poly(c, [[2, 32], [28, 8], [54, 32]], (x, y) => (y % 4 === 0 ? '#5a2830' : '#6e3438'));
  c.fillStyle = '#9a5a4a'; for (let i = 0; i < 26; i++) { c.fillRect(28 - i, 8 + i, 1, 1); } // підсвітка лівого ребра
  c.fillStyle = '#7a4a40'; for (let i = 0; i < 14; i++) c.fillRect(28 + i, 8 - (i >> 1), 1, 1);
  // димар
  c.fillStyle = '#2e2b2e'; c.fillRect(44, 4, 6, 12); c.fillStyle = '#4a4548'; c.fillRect(44, 4, 6, 1);
  // двері, вікно (вікно світиться окремо)
  c.fillStyle = '#1f1618'; c.fillRect(24, 44, 9, 16); c.fillRect(25, 43, 7, 1); c.fillStyle = '#3a2a24'; c.fillRect(24, 44, 1, 16);
  c.fillStyle = '#ffcf7a'; c.fillRect(12, 40, 8, 8); c.fillStyle = '#3c2a24'; c.fillRect(15, 40, 1, 8); c.fillRect(12, 43, 8, 1); c.fillRect(11, 48, 10, 1);
  c.fillStyle = '#ffcf7a'; c.fillRect(56, 38, 5, 6); c.fillStyle = '#3c2a24'; c.fillRect(58, 38, 1, 6);
  return { cv, ax: 28, ay: 62, win: [16, 44], win2: [58, 41], chim: [47, 3] };
}
const SP = { oak: [1, 2, 3, 4, 5].map(i => makeOak(i * 77, i === 3)), pine: [1, 2, 3].map(i => makePine(i * 31)), bush: [1, 2, 3].map(i => makeBush(i * 13)), house: makeHouse() };

// ---------- земля ----------
const POND = { x: 150, y: 105, rx: 62, ry: 36 };
const [ground, gctx] = mk(GW, GH);
(function buildGround() {
  const R = rng(4242), c = gctx, img = c.createImageData(GW, GH), d = img.data;
  const vn = (x, y, s) => { const X = Math.floor(x / s), Y = Math.floor(y / s); const h = (a, b) => { let n = Math.imul(a * 374761393 + b * 668265263, 1274126177); return ((n ^ n >>> 13) >>> 0) / 4294967296; }; const fx = x / s - X, fy = y / s - Y, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy); return lerp(lerp(h(X, Y), h(X + 1, Y), sx), lerp(h(X, Y + 1), h(X + 1, Y + 1), sx), sy); };
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const n = vn(x, y, 60) * .6 + vn(x, y, 18) * .4;
    const dx = (x - GCX) / 700, dy = (y - GCY) / 320, e = Math.min(1, Math.sqrt(dx * dx + dy * dy));
    const q = Math.floor(n * 5) / 5; // постеризація => «плями» як у піксельарті
    const i = (y * GW + x) * 4;
    d[i] = 112 + q * 40; d[i + 1] = 138 + q * 36; d[i + 2] = 78 + q * 26; d[i + 3] = 255;
    const dark = e * e * .55; d[i] *= 1 - dark; d[i + 1] *= 1 - dark; d[i + 2] *= 1 - dark * .8;
  }
  c.putImageData(img, 0, 0);
  const G = (px, py) => [Math.round(GCX + px), Math.round(GCY + py * ISO)];
  // стежка: будинок -> вогнище -> тренувальний майданчик
  c.fillStyle = '#a58a62';
  const path = [[-90, -22], [-60, -10], [-20, 14], [30, 28], [70, 10], [105, -6]];
  for (let t = 0; t < 1; t += 0.004) {
    const k = t * (path.length - 1), i = Math.min(path.length - 2, k | 0), f = k - i;
    const px = lerp(path[i][0], path[i + 1][0], f), py = lerp(path[i][1], path[i + 1][1], f);
    const [x, y] = G(px, py); const w = 6 + Math.floor(R() * 3);
    c.fillStyle = R() < .5 ? '#a58a62' : '#96794f'; c.fillRect(x - w, y - 2, w * 2, 4);
  }
  for (let i = 0; i < 260; i++) { const [x, y] = G(-120 + R() * 260, -30 + R() * 80); c.fillStyle = '#7a6444'; c.fillRect(x, y, 2, 1); }
  // ставок
  const [px, py] = G(POND.x, POND.y);
  for (let dy = -POND.ry * ISO - 3; dy <= POND.ry * ISO + 3; dy++) for (let dx = -POND.rx - 3; dx <= POND.rx + 3; dx++) {
    const u = dx / POND.rx, v = dy / (POND.ry * ISO), r = u * u + v * v + (vn(px + dx, py + dy, 9) - .5) * .12;
    if (r < 1.0) { c.fillStyle = r < .72 ? '#27455a' : '#33607a'; c.fillRect(px + Math.round(dx), py + Math.round(dy), 1, 1); }
    else if (r < 1.18) { c.fillStyle = '#5c5a48'; c.fillRect(px + Math.round(dx), py + Math.round(dy), 1, 1); }
  }
  // травинки
  for (let i = 0; i < 5200; i++) {
    const x = R() * GW | 0, y = R() * GH | 0, px2 = x - GCX, py2 = (y - GCY) / ISO;
    if (((px2 - POND.x) / (POND.rx + 6)) ** 2 + ((py2 - POND.y) / (POND.ry + 6)) ** 2 < 1) continue;
    const e = Math.min(1, Math.hypot((x - GCX) / 700, (y - GCY) / 320)), s = R();
    c.fillStyle = s < .5 ? '#9fb66c' : s < .85 ? '#5f7d4a' : '#d7c47a'; c.globalAlpha = (1 - e * .6) * (s < .85 ? .7 : .55);
    c.fillRect(x, y, 1, 2 + (R() * 2 | 0));
    if (s < .5) c.fillRect(x + 2, y + 1, 1, 2);
  }
  c.globalAlpha = 1;
})();

// ---------- сцена: статичні об'єкти ----------
const props = []; // {x,y,sp}
{
  const R = rng(99);
  const clear = (x, y) => (Math.abs(x - 10) < 200 && Math.abs(y - 10) < 95) || (((x - POND.x) / (POND.rx + 14)) ** 2 + ((y - POND.y) / (POND.ry + 14)) ** 2 < 1);
  const add = (x, y, kind, i) => props.push({ x, y, sp: SP[kind][Math.abs(i) % SP[kind].length] });
  props.push({ x: -170, y: 52, sp: SP.oak[2], big: true });
  for (let i = 0; i < 150; i++) {
    const x = (R() - .5) * 1300, y = (R() - .5) * 760;
    if (clear(x, y) || Math.hypot(x + 170, y - 52) < 30) continue;
    if (R() < .62) add(x, y, 'pine', i); else add(x, y, 'oak', i);
  }
  for (let i = 0; i < 40; i++) { const x = (R() - .5) * 760, y = (R() - .5) * 420; if (!clear(x, y) || Math.abs(x) < 190 && Math.abs(y) < 90) { if (!clear(x, y) && !(Math.abs(x) < 190 && Math.abs(y) < 90)) add(x, y, 'bush', i); } }
  for (const [x, y] of [[-125, 5], [-150, 10], [-60, 65], [190, 8], [-30, -78], [205, -70]]) add(x, y, 'bush', x | 0);
  props.push({ x: -95, y: -28, sp: SP.house, house: true });
}
const FIRE = { x: 28, y: 24 }, BANNER = { x: 58, y: -64 }, DUMMY = { x: 118, y: -12 }, LOGS = { x: -36, y: 46 };
const HOUSE = props.find(p => p.house);

// ---------- персонажі ----------
const CLS = {
  knight:     { cloak: '#7b2f3a', trim: '#b9b9c6', hood: '#a9acb8', skin: '#d9a97a', tool: 'sword', plume: true, spd: 26 },
  woodcutter: { cloak: '#6e4b2a', trim: '#4c321e', hood: '#4b3320', skin: '#d9a97a', tool: 'axe', spd: 24 },
  mage:       { cloak: '#43408a', trim: '#8a86d6', hood: '#2f2e66', skin: '#e3bd95', tool: 'staff', hat: true, spd: 22 },
  archer:     { cloak: '#43713d', trim: '#2c4a2a', hood: '#2c4a2a', skin: '#d9a97a', tool: 'bow', spd: 30 },
  builder:    { cloak: '#9a7a3e', trim: '#6a4a2a', hood: '#d1a84e', skin: '#d9a97a', tool: 'hammer', hardhat: true, spd: 24 },
  lord:       { cloak: '#5a2a66', trim: '#e0b84a', hood: '#e0b84a', skin: '#e3bd95', tool: 'none', crown: true, spd: 18 },
};
const chars = [];
const S = (x, y, face, act, dur) => ({ x, y, face, act, dur });
function spawn(cls, x, y, spots) { chars.push({ cls, x, y, dir: 1, st: 'walk', spot: null, spots, t: Math.random() * 5, ph: 0, tw: 0, hit: -1, tgt: null }); }
spawn('knight', 40, -30, [S(98, -10, 1, 'swing', 7), S(5, 40, 1, 'idle', 3), S(-10, -30, -1, 'idle', 3)]);
spawn('woodcutter', -120, 20, [S(-158, 50, -1, 'chop', 8), S(LOGS.x - 14, LOGS.y + 3, -1, 'idle', 3), S(FIRE.x + 22, FIRE.y + 6, -1, 'idle', 3)]);
spawn('mage', 90, 60, [S(POND.x - 70, POND.y - 5, 1, 'cast', 7), S(FIRE.x - 18, FIRE.y + 10, 1, 'idle', 3), S(BANNER.x - 16, BANNER.y + 14, 1, 'idle', 3)]);
spawn('archer', 70, -40, [S(40, -12, 1, 'shoot', 9), S(FIRE.x + 6, FIRE.y - 14, -1, 'idle', 3), S(130, 30, -1, 'idle', 3)]);
spawn('builder', -70, 0, [S(-62, -20, -1, 'hammer', 8), S(LOGS.x + 12, LOGS.y - 4, 1, 'idle', 3), S(-110, -14, 1, 'hammer', 6)]);
spawn('lord', 0, 0, [S(-85, -18, -1, 'idle', 4), S(FIRE.x - 4, FIRE.y + 16, 1, 'idle', 5), S(BANNER.x - 12, BANNER.y + 16, 1, 'idle', 4), S(70, 20, 1, 'idle', 3)]);

// ---------- частинки ----------
const parts = [];
function emit(o) { parts.push(Object.assign({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, g: 0, life: 1, max: 1, col: '#fff', s: 1, a: 1, kind: 'p' }, o, { max: o.life })); }

// ---------- рендер ----------
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const [lightC, lctx] = mk(8, 8);
let W = 0, H = 0, SC = 2;
function resize() {
  SC = Math.max(2, Math.round(innerHeight / 220));
  W = Math.ceil(innerWidth / SC); H = Math.ceil(innerHeight / SC);
  cvs.width = W; cvs.height = H; cvs.style.width = W * SC + 'px'; cvs.style.height = H * SC + 'px';
  lightC.width = W; lightC.height = H;
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();
const [fogS, fctx] = mk(256, 96);
{ const g = fctx.createRadialGradient(128, 48, 0, 128, 48, 120); g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)'); fctx.save(); fctx.scale(1, .4); fctx.fillStyle = g; fctx.fillRect(0, 0, 256, 240); fctx.restore(); }
const fogs = Array.from({ length: 7 }, (_, i) => ({ x: Math.random() * 1400 - 700, y: (Math.random() - .5) * 300, s: 1.5 + Math.random() * 2, v: 3 + Math.random() * 5 }));
const flies = Array.from({ length: 34 }, () => ({ x: (Math.random() - .5) * 460, y: (Math.random() - .5) * 220, ph: Math.random() * 9, sp: .6 + Math.random() * 1.2, r: 8 + Math.random() * 14 }));

const ox = () => Math.round(W / 2), oy = () => Math.round(H / 2);
const sxy = (px, py, z = 0) => [Math.round(ox() + px), Math.round(oy() + py * ISO - z)];
const smooth = t => t * t * (3 - 2 * t);

function drawChar(c, tm) {
  const k = CLS[c.cls], f = c.dir, [x, y] = sxy(c.x, c.y);
  const moving = c.st === 'walk', ph = c.ph;
  const bob = moving ? (Math.abs(Math.sin(ph)) > .55 ? 1 : 0) : 0, br = Math.sin(tm * 2 + c.t) > .7 ? 1 : 0;
  const R = (dx, up, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(f > 0 ? x + dx : x - dx - w, y - up - h, w, h); };
  // тінь
  ctx.fillStyle = 'rgba(8,6,16,.38)'; ctx.fillRect(x - 5, y - 1, 11, 2); ctx.fillRect(x - 3, y - 2, 7, 1); ctx.fillRect(x - 3, y + 1, 7, 1);
  // ноги
  const la = moving && Math.sin(ph) > 0, lb = moving && Math.sin(ph) <= 0;
  R(-2, la ? 1 : 0, 2, la ? 3 : 4, '#2a2430'); R(1, lb ? 1 : 0, 2, lb ? 3 : 4, '#241f2a');
  // плащ/тіло
  R(-3, 4 + bob, 6, 7, k.cloak); R(-3, 4 + bob, 6, 1, k.trim); R(-3, 7 + bob, 6, 1, '#1b161e');
  R(-4, 5 + bob, 1, 5, k.cloak); // спина плаща
  if (c.cls === 'lord') { R(-4, 3 + bob, 2, 8, '#42204c'); R(-3, 10 + bob, 6, 1, '#f1eada'); }
  // голова
  const hb = bob + br * 0;
  R(-2, 11 + hb, 5, 4, k.skin);
  R(-3, 13 + hb, 6, 3, k.hood); R(-3, 11 + hb, 2, 3, k.hood);
  R(1, 12 + hb, 1, 1, '#1a1418'); // око
  if (k.hat) { R(-3, 16 + hb, 7, 1, k.hood); R(-2, 17 + hb, 5, 2, k.hood); R(-1, 19 + hb, 3, 2, k.hood); R(0, 21 + hb, 2, 1, k.hood); R(-3, 16 + hb, 7, 1, k.trim); R(-1, 12 + hb, 3, 2, '#d8d4e8'); }
  if (k.hardhat) { R(-3, 16 + hb, 7, 1, '#b58a36'); R(-2, 17 + hb, 5, 1, k.hood); }
  if (k.plume) { R(-3, 16 + hb, 6, 1, k.hood); R(-4, 17 + hb, 2, 3, '#c2323c'); R(-5, 19 + hb, 2, 1, '#c2323c'); R(1, 12 + hb, 2, 1, '#2a2a34'); }
  if (k.crown) { R(-2, 16 + hb, 5, 1, '#e0b84a'); R(-2, 17 + hb, 1, 1, '#e0b84a'); R(0, 17 + hb, 1, 1, '#e0b84a'); R(2, 17 + hb, 1, 1, '#e0b84a'); R(0, 14 + hb, 3, 1, '#d8d4c8'); }
  // інструмент і щит
  const hx = x + f * 3, hy = y - 7 - bob;
  const line = (x0, y0, a, len, col) => { const ar = a * Math.PI / 180; ctx.fillStyle = col; let ex = x0, ey = y0; for (let i = 0; i <= len; i++) { ex = Math.round(x0 + f * Math.cos(ar) * i); ey = Math.round(y0 - Math.sin(ar) * i); ctx.fillRect(ex, ey, 1, 1); } return [ex, ey]; };
  const act = c.st === 'work' ? c.spot.act : 'none';
  const cyc = rate => { const u = c.tw * rate, n = Math.floor(u), p = u - n; return { n, p }; };

  } else if (k.tool === 'bow') {

function hitDummy() { dummy.w = 1; }

function drawProp(p, tm) {

function step(dt, tm) {

const kF = { fire: 1, vig: .55 };
